# Agezt gitleaks configuration.
#
# Purpose: keep `gitleaks detect` at zero so it is an *enforceable* secret gate.
# The scan has to stay at zero, or a real leak hides in the noise. This config
# extends the default ruleset and allowlists only the test files whose job is
# to embed secret-shaped strings — never production code — and .gitleaks-baseline
# absorbs the one remaining hit, which is history rather than a file on disk.
#
# Two numbers, measured 2026-09-30 over the full 2,071-commit history
# (393 MB, 45.7s):
#
#   allowlist + baseline, as CI runs it   -> no leaks found, exit 0
#   baseline only, allowlist disabled     -> 1 finding, exit 1
#
# That single finding is a false positive: a `private-key` match on the line
# "10. **PEM edge cases:** `-----BEGIN PGP PRIVATE KEY BLOCK-----` does not
# match …" inside security-report/infra-results.md — prose *about* key formats
# in a document about secret detection, not a key. The file was deleted from
# HEAD in the v1.1.0 release commit (e872a832), but gitleaks scans history,
# so the finding is still live and the baseline entry is load-bearing. It
# cannot be cleared without rewriting history.
#
# This comment previously claimed the unfiltered scan reports 16 hits, all test
# fixtures. That was true when written and is now stale: the allowlist below
# covers the fixtures, and what remains is the one finding above.
#
# Run:  gitleaks detect --no-banner --redact -s . -b .gitleaks-baseline
# Expect: "no leaks found".

title = "Agezt"

[extend]
useDefault = true

[allowlist]
description = """
Test fixtures only. These files intentionally embed secret-shaped strings:
  - kernel/redact/*_test.go      verify the redactor scrubs API keys / tokens / JWTs
  - cmd/agezt/plugin_log_test.go verifies plugin-log lines redact provider keys
  - kernel/creds/aws_test.go     placeholder AWS creds (AKIA1111…, secret1234…)
                                 used to test credential-file / IMDS parsing
  - kernel/agentgw/gateway_test.go        hand-built fake JWTs exercising the
  - kernel/configcenter/configcenter_test.go  agent-SDK token validator and the
                                 secret classifier (M939)
  - kernel/controlplane/workflow_test.go  "wrong-secret-123" webhook-HMAC
                                 negative fixture
  - kernel/auth/auth_test.go     "0123456789abcdef" written twice — a 32-char
                                 hex token whose only job is to prove
                                 WriteTokenFile truncates it to "0123…cdef".
                                 The package arrived with the 2026-07-26
                                 route-auth centralisation, after this
                                 allowlist was written, so the scan had been
                                 failing on it since.
All values are obviously synthetic; no real secret is committed. The allowlist is
scoped to these test paths so any secret introduced anywhere in production code,
or in any other test, still trips the scan.
"""
paths = [
  '''kernel/redact/.*_test\.go$''',
  '''cmd/agezt/plugin_log_test\.go$''',
  '''kernel/creds/aws_test\.go$''',
  '''kernel/agentgw/gateway_test\.go$''',
  '''kernel/configcenter/configcenter_test\.go$''',
  '''kernel/controlplane/workflow_test\.go$''',
  '''kernel/auth/auth_test\.go$''',
  # Historical security-assessment output. The Phase-1 infra scan (commit 3147a2f9)
  # contains a private-key pattern match that is a false positive — an inline PEM
  # block inside a security-finding description. These files are readonly audit
  # records, never production code. Scoped to the historical report directory.
  '''security-report-2026-08-13/.*$''',
]
